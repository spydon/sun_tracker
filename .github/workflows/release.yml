name: Release APK

on:
  workflow_run:
    workflows: [cicd]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::error::The UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD secrets are required to sign the APK."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyPassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          tag="v${version}-build.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "sun-tracker-${version}.apk"
          gh release create "$tag" "sun-tracker-${version}.apk" \
            --target "$RELEASE_SHA" \
            --title "Sun Tracker ${version} (build ${{ github.run_number }})" \
            --generate-notes
